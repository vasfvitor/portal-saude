name: Publish site

# The pages are built from the operator data that ans-feeds publishes every day (its workflow runs at 10:30
# UTC) and from the monthly CMED price list that anvisa-feeds publishes. The cron passes after the ans-feeds
# run and twice more, and only publishes when the ans-feeds data date, the CMED list stamp or the ANVISA
# registration build behind cmed/dados moved against what the site was built from (/build.json). Push and
# manual dispatch always publish. The producers' scheduled runs start late (their bot commits land between
# 13:00 and 16:00 UTC), so the passes sit after that window.
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 13 * * *" # an early ans-feeds and anvisa-feeds run
    - cron: "45 17 * * *" # their usual commit window has passed
    - cron: "15 21 * * *" # a manual or very late run during the day
  workflow_dispatch:

# Least privilege: nothing by default; each job asks for the scope it uses.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {} # reads public URLs only
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Compare the data date with what the site was built from
        id: compare
        env:
          EVENT: ${{ github.event_name }}
          # the same as META_URL / CMED_DADOS_URL in src/lib/config.ts and `site` in astro.config.mjs
          META: https://ans.feeds.abelhaninja.de/meta.json
          CMED_META: https://anvisa.feeds.abelhaninja.de/meta.json
          PUBLISHED: https://saude.abelhaninja.de/build.json
        run: |
          if [ "$EVENT" != schedule ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ?t= gets past the 600 s Pages cache; any failed read counts as a change (publish)
          dados=$(curl -fsS "$META?t=$(date +%s)" | jq -er .date) || dados=""
          cmed=$(curl -fsS "$CMED_META?t=$(date +%s)" | jq -er .cmed.stamp) || cmed=""
          # the registration status and measures change daily, independently of the list stamp
          # jq -r without -e: a missing build prints null on both sides and still compares
          situacao=$(curl -fsS "$CMED_META?t=$(date +%s)" | jq -r .cmed.situacao_build) || situacao=""
          # plain http as a fallback while the Pages certificate is missing or being renewed
          site=$(curl -fsS "$PUBLISHED?t=$(date +%s)" || curl -fsS "${PUBLISHED/https:/http:}?t=$(date +%s)") || site=""
          site_dados=$(jq -er .dados_date <<<"$site" 2>/dev/null) || site_dados=""
          site_cmed=$(jq -er .cmed_stamp <<<"$site" 2>/dev/null) || site_cmed=""
          site_situacao=$(jq -r .situacao_build <<<"$site" 2>/dev/null) || site_situacao=""
          echo "dados: ${dados:-?} / ${site_dados:-?} · cmed: ${cmed:-?} / ${site_cmed:-?} · situação: ${situacao:-?} / ${site_situacao:-?}"
          if [ -n "$dados" ] && [ "$dados" = "$site_dados" ] && [ -n "$cmed" ] && [ "$cmed" = "$site_cmed" ] \
            && [ -n "$situacao" ] && [ "$situacao" = "$site_situacao" ]; then
            echo "unchanged: built from the data of $dados, the CMED list $cmed and the registration build $situacao"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: verify
    if: needs.verify.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # reads the repository
      pages: write # publishes to GitHub Pages
      id-token: write # OIDC required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # this job pushes nothing

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # after pnpm: `cache: pnpm` needs pnpm on the PATH
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # format and lint first: they fail fast and need no network (lint runs astro sync before)
      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm test

      # check and build read the live data (an empty PUBLIC_DADOS_URL falls back to config.ts)
      - run: pnpm check

      - name: Build
        run: pnpm build

      # only the search script, no e-mail address, no broken internal link, a page per operator and medicine
      - run: pnpm check:dist

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
